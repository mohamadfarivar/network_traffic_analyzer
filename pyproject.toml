[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-traffic-analyzer"
version = "0.1.0"
description = "A real-time network traffic analyzer for Windows"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.6,<3"
]

[tool.setuptools.packages.find]
where = ["src"]
